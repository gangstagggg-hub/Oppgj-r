name: Bygg Android (APK og AAB)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Hent koden
        uses: actions/checkout@v4

      - name: Sjekk at hemmelighetene finnes
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Mangler hemmeligheter i GitHub:$missing (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - name: Sett opp Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Godta Android SDK-lisenser
        # Android SDK ligger ferdig installert på GitHub-maskinen. Lisensene må være godtatt
        # for at Gradle kan hente manglende pakker selv.
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Sett opp Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Lag nøkkelfilen
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Bygg APK og AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Last opp APK
        uses: actions/upload-artifact@v4
        with:
          name: oppgjor-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Last opp AAB
        uses: actions/upload-artifact@v4
        with:
          name: oppgjor-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
